<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found — CLEANORA® Luxury Cleaning Services</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #071912; color: #f4f7f5; }
    .font-serif-luxury { font-family: 'Cormorant Garamond', serif; }
    .gold-gradient-text {
      background: linear-gradient(135deg, #fae5a5 0%, #e8c468 45%, #c99e3b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .btn-gold {
      background: linear-gradient(135deg, #f3d88c 0%, #e4be60 50%, #cfa341 100%);
      color: #071b13;
      box-shadow: 0 8px 25px -4px rgba(232, 196, 104, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.6);
    }
    .glass-card {
      background: linear-gradient(160deg, rgba(16, 49, 36, 0.78) 0%, rgba(9, 28, 20, 0.88) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(232, 196, 104, 0.28);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="glass-card rounded-3xl p-10 sm:p-14 max-w-xl w-full text-center space-y-6">
    <div class="w-16 h-16 rounded-full border border-[#e8c468]/50 bg-[#0d291e] flex items-center justify-center mx-auto">
      <i data-lucide="sparkles" class="w-8 h-8 text-[#e8c468]"></i>
    </div>
    <p class="text-xs uppercase tracking-[0.25em] text-[#e8c468] font-semibold">Error 404 • Space Not Found</p>
    <h1 class="font-serif-luxury text-4xl sm:text-5xl text-white">This Room Has Already Been <span class="italic gold-gradient-text">Cleared.</span></h1>
    <p class="text-sm text-gray-300 leading-relaxed">
      The page you are looking for may have been moved or does not exist. Let us guide you back to our spotless spaces.
    </p>
    <div class="flex flex-wrap items-center justify-center gap-4 pt-2">
      <a href="/" class="btn-gold px-6 py-3 rounded-full text-xs font-bold flex items-center gap-2">
        <i data-lucide="home" class="w-4 h-4"></i> Return to Home
      </a>
      <a href="/book" class="px-6 py-3 rounded-full border border-[#e8c468]/40 text-xs font-semibold text-[#e8c468] hover:bg-[#e8c468]/10 transition">
        Book a Cleaning →
      </a>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
